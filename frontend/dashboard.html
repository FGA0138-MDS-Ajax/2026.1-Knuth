<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geral - KNUTHS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-layout">

    <nav class="sidebar">

        <div class="logo">KNUTHS</div>

        <div class="sidebar-perfil">
            <span class="sidebar-nome" id="sidebarNome">...</span>
            <small class="sidebar-cargo" id="sidebarCargo"></small>
        </div>

        <ul>
            <li><a href="dashboard.html" id="menuGeral">🏠 Mural Geral</a></li>
            <li><a href="dashboard-academico.html" id="menuAcademico">👤 Perfil &amp; Acadêmico</a></li>
            <li><a href="turmas.html" id="menuTurmas">📚 Turmas</a></li>
            <li><a href="disciplinas.html" id="menuDisciplinas">📖 Disciplinas</a></li>
            <li><a href="duvidas.html" id="menuDuvidas">❓ Dúvidas</a></li>
        </ul>

        <button id="btnSair" class="btn-sair">Sair</button>

    </nav>

    <main class="main-content">

        <div class="top-header">
            <h2>Mural Geral</h2>
            <span id="boas-vindas" class="boas-vindas"></span>
        </div>

        <div class="post-card aviso-sistema">
            <div class="post-header">
                <span>📢 Coordenação</span>
                <span>Sistema KNUTHS</span>
            </div>
            <p>Bem-vindo ao sistema KNUTHS. Fique de olho no mural para novos avisos.</p>
        </div>

        <div class="fazer-pergunta">
            <select id="seletorTurmaFeed">
                <option value="">Selecione uma turma para postar...</option>
            </select>
            <textarea id="textoDuvida" placeholder="Tem alguma dúvida? Pergunte aqui..."></textarea>
            <button id="btnPublicarFeed">Enviar Pergunta</button>
        </div>

        <div class="secao-perguntas">
            <h3 class="secao-titulo">❓ Dúvidas Recentes das Suas Turmas</h3>
            <div id="feedDuvidas">
                <p class="feed-estado">Carregando dúvidas...</p>
            </div>
        </div>

    </main>

    <script src="config.js"></script>
    <script src="dashboard.js"></script>

</body>
</html>
