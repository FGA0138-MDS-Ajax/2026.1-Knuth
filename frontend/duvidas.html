<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNUTHS - Dúvidas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="duvidas.css">
</head>

<body class="dashboard-layout">

    <nav class="sidebar">
        <div class="logo">KNUTHS</div>
        <div class="sidebar-perfil">
            <span class="sidebar-nome" id="sidebarNome">...</span>
            <small class="sidebar-cargo" id="sidebarCargo"></small>
        </div>
        <ul>
            <li><a href="dashboard.html" id="menuGeral">🏠 Mural Geral</a></li>
            <li><a href="dashboard-academico.html" id="menuAcademico">👤 Perfil &amp; Acadêmico</a></li>
            <li><a href="turmas.html" id="menuTurmas">📚 Turmas</a></li>
            <li><a href="disciplinas.html" id="menuDisciplinas">📖 Disciplinas</a></li>
            <li><a href="duvidas.html" id="menuDuvidas">❓ Dúvidas</a></li>
        </ul>
        <button id="btnSair" class="btn-sair">Sair</button>
    </nav>

    <main class="main-content">

        <div class="topo">
            <h2>❓ Sistema de Dúvidas</h2>

            <button id="btnNovaDuvida" disabled>
                + Nova Dúvida
            </button>
        </div>

        <div class="controles">

            <select id="seletorTurma">
                <option value="">Selecione uma turma...</option>
            </select>

            <select id="filtroStatus">
                <option value="todas">Todos os status</option>
                <option value="aberta">Aberta</option>
                <option value="em andamento">Em andamento</option>
                <option value="resolvida">Resolvida</option>
            </select>

            <select id="filtroPrioridade">
                <option value="todas">Todas as prioridades</option>
                <option value="alta">Alta</option>
                <option value="media">Média</option>
                <option value="baixa">Baixa</option>
            </select>

        </div>

        <div id="formulario" class="formulario escondido">

            <textarea
                id="textoPergunta"
                placeholder="Descreva sua dúvida (mín. 5, máx. 500 caracteres)"
            ></textarea>

            <div class="opcoes-restricao">

                <label>
                    <input type="checkbox" id="restritaProfessor">
                    Restrita ao professor
                </label>

                <label>
                    <input type="checkbox" id="restritaMonitor">
                    Restrita ao monitor
                </label>

            </div>

            <div class="opcao-prioridade">
                <label for="prioridade">Prioridade:</label>
                <select id="prioridade">
                    <option value="baixa">Baixa</option>
                    <option value="media" selected>Média</option>
                    <option value="alta">Alta</option>
                </select>
            </div>

            <button id="publicar">
                Publicar Dúvida
            </button>

        </div>

        <p id="mensagemVazio" class="mensagem-vazio escondido">
            Nenhuma dúvida encontrada para esta turma.
        </p>

        <div id="listaDuvidas" class="container-duvidas"></div>

    </main>

    <script src="config.js"></script>
    <script src="duvidas.js"></script>

</body>

</html>
