<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNUTHS - Turmas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="turmas.css">
</head>

<body class="dashboard-layout">

    <nav class="sidebar">
        <div class="logo">KNUTHS</div>
        <div class="sidebar-perfil">
            <span class="sidebar-nome" id="sidebarNome">...</span>
            <small class="sidebar-cargo" id="sidebarCargo"></small>
        </div>
        <ul>
            <li><a href="dashboard.html" id="menuGeral">🏠 Mural Geral</a></li>
            <li><a href="dashboard-academico.html" id="menuAcademico">👤 Perfil &amp; Acadêmico</a></li>
            <li><a href="turmas.html" id="menuTurmas">📚 Turmas</a></li>
            <li><a href="disciplinas.html" id="menuDisciplinas">📖 Disciplinas</a></li>
            <li><a href="duvidas.html" id="menuDuvidas">❓ Dúvidas</a></li>
        </ul>
        <button id="btnSair" class="btn-sair">Sair</button>
    </nav>

    <main class="main-content">
        <div class="topo">
            <h2 id="tituloTurmas">📚 Minhas Turmas</h2>
            <div class="botoes-acao">
                <button id="btnEntrarCodigo">Entrar com Código</button>
                <button id="novaTurma">+ Nova Turma</button>
            </div>
        </div>

        <div class="busca">
            <input type="text" id="buscaTurma" placeholder="Pesquisar turma...">
            <button id="buscarTurma">Buscar</button>
        </div>

        <p id="mensagemErro"></p>

        <div class="container-turmas" id="containerTurmas">
            <p style="color:#666; font-size: 14px; text-align: center; padding: 20px;">Carregando turmas...</p>
        </div>

        <!-- Modais -->
        <div id="modalCriar" class="modal oculta">
            <div class="modal-conteudo">
                <h3>Criar Nova Turma</h3>
                <input type="text" id="inputNomeTurma" placeholder="Nome da Turma (Ex: Turma A)" required>
                <select id="selectDisciplina" required>
                    <option value="">Selecione a Disciplina...</option>
                </select>
                <input type="text" id="inputHorario" placeholder="Horário (Ex: Seg/Qua 14:00-16:00)" required>
                <input type="text" id="inputPeriodo" placeholder="Período (Ex: 2026.1)" value="2026.1" required>
                <div class="modal-botoes">
                    <button id="btnCancelarCriar" class="btn-cancelar">Cancelar</button>
                    <button id="btnConfirmarCriar" class="btn-confirmar">Criar</button>
                </div>
            </div>
        </div>

        <div id="modalEntrar" class="modal oculta">
            <div class="modal-conteudo">
                <h3>Entrar em uma Turma</h3>
                <input type="text" id="inputCodigoAcesso" placeholder="Código de acesso" required>
                <div class="modal-botoes">
                    <button id="btnCancelarEntrar" class="btn-cancelar">Cancelar</button>
                    <button id="btnConfirmarEntrar" class="btn-confirmar">Entrar</button>
                </div>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="turmas.js"></script>
</body>

</html>
