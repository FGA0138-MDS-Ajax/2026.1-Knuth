<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNUTHS - Turmas</title>
    <link rel="stylesheet" href="turmas.css">
</head>

<body>

    <header>
        <h1>KNUTHS</h1>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="turmas.html">Turmas</a>
            <a href="disciplinas.html">Disciplinas</a>
        </nav>
    </header>

    <main>
        <div class="topo">
            <h2>📚 Minhas Turmas</h2>
            </div>

        <div class="form-turma" style="background: #f4f4f4; padding: 15px; margin-bottom: 20px;">
            <h3>Criar Nova Turma</h3>
            <input type="text" id="descInput" placeholder="Nome da Turma">
            <input type="text" id="horarioInput" placeholder="Horário (ex: 14:00)">
            <input type="number" id="discIdInput" placeholder="ID da Disciplina">
            <input type="number" id="profIdInput" placeholder="ID do Professor">
            <button id="btnCriar">Confirmar Criação</button>
        </div>

        <div class="busca">
            <input type="text" id="buscaTurma" placeholder="Pesquisar turma...">
            <button id="buscarTurma">Buscar</button>
        </div>
        
    <main>
        <div class="topo">
            <h2>📚 Minhas Turmas</h2>
            <button id="novaTurma">+ Nova Turma</button>
        </div>

        <div class="busca">
            <input type="text" id="buscaTurma" placeholder="Pesquisar turma...">
            <button id="buscarTurma">Buscar</button>
        </div>

        <p id="mensagemErro"></p>

        <div class="container-turmas" id="listaTurmas">
            </div>
    </main>

    <script src="turmas.js"></script>
</body>
</html>
